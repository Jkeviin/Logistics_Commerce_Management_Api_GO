host: localhost:8080
info:
  contact: {}
  description: API para gestionar sellers y warehouses
  title: API de Sellers y Warehouses
  version: "1.0"
paths:
  /buyers:
    get:
      description: Devuelve todos los buyers del sistema
      produces:
      - application/json
      responses:
        "200":
          description: Lista de buyers obtenida exitosamente
          schema:
            $ref: '#/definitions/domain.BuyerListResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Devuelve todos los buyers
      tags:
      - Buyer
    post:
      consumes:
      - application/json
      description: Crea un nuevo buyer en el sistema
      parameters:
      - description: Buyer a crear
        in: body
        name: buyer
        required: true
        schema:
          $ref: '#/definitions/domain.BuyerAttributes'
      produces:
      - application/json
      responses:
        "201":
          description: Buyer creado exitosamente
          schema:
            $ref: '#/definitions/domain.BuyerDoc'
        "409":
          description: Código del buyer ya existente
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "422":
          description: Error de validación
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Crea un nuevo buyer
      tags:
      - Buyer
  /buyers/{id}:
    delete:
      description: Elimina un buyer por id
      parameters:
      - description: ID del buyer
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Buyer eliminado exitosamente
        "400":
          description: Error de validación
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: Buyer no encontrado
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Elimina un buyer por id
      tags:
      - Buyer
    get:
      description: Devuelve un buyer por id
      parameters:
      - description: ID del buyer
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Buyer obtenido exitosamente
          schema:
            $ref: '#/definitions/domain.BuyerResponse'
        "400":
          description: Error de validación
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: Buyer no encontrado
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Devuelve un buyer por id
      tags:
      - Buyer
    patch:
      consumes:
      - application/json
      description: Actualiza un buyer por id
      parameters:
      - description: ID del buyer
        in: path
        name: id
        required: true
        type: integer
      - description: Buyer a actualizar
        in: body
        name: buyer
        required: true
        schema:
          $ref: '#/definitions/domain.BuyerAttributes'
      produces:
      - application/json
      responses:
        "200":
          description: Buyer actualizado exitosamente
          schema:
            $ref: '#/definitions/domain.BuyerResponse'
        "400":
          description: Error de validación
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: Buyer no encontrado
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "409":
          description: Código del buyer ya existente
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Actualiza un buyer por id
      tags:
      - Buyer
  /buyers/reportPurchaseOrders:
    get:
      description: Devuelve un reporte de órdenes de compra por Buyer
      parameters:
      - description: ID del buyer
        in: query
        name: id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Reporte de órdenes de compra obtenido exitosamente
          schema:
            $ref: '#/definitions/domain.BuyerPurchaseOrdersReportResponse'
        "400":
          description: Error de validación
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: Buyer no encontrado
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Reporte de órdenes de compra por Buyer
      tags:
      - Buyer
  /carries:
    post:
      consumes:
      - application/json
      description: Crea un nuevo carry en el sistema
      parameters:
      - description: Datos del carry
        in: body
        name: carries
        required: true
        schema:
          $ref: '#/definitions/domain.CarriesDoc'
      produces:
      - application/json
      responses:
        "201":
          description: Carry creado
          schema:
            $ref: '#/definitions/domain.CarryResponse'
        "409":
          description: Carry ya existe
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "422":
          description: Error de validación
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Crea un nuevo carry
      tags:
      - Carries
  /employee/reportInboundOrders:
    get:
      description: Reporte de inbound orders por empleado
      parameters:
      - description: ID de la sección
        in: query
        name: id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Reporte de inbound orders por empleado
          schema:
            $ref: '#/definitions/domain.EmployeeWithInboundOrdersCountResponse'
        "400":
          description: ID malformado
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: El empleado no existe
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Reporte de inbound orders por empleado
      tags:
      - Employee
  /employees:
    get:
      description: Retorna una lista de todos los Employees registrados en el sistema
      produces:
      - application/json
      responses:
        "200":
          description: Listado de Employees
          schema:
            $ref: '#/definitions/domain.EmployeesResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Lista todos los Employees
      tags:
      - Employee
    post:
      consumes:
      - application/json
      description: Crea un nuevo empleado en el sistema con los datos proporcionados
      parameters:
      - description: Datos del empleado a crear
        in: body
        name: employee
        required: true
        schema:
          $ref: '#/definitions/domain.EmployeeAttributes'
      produces:
      - application/json
      responses:
        "201":
          description: Empleado creado exitosamente
          schema:
            $ref: '#/definitions/domain.EmployeeResponse'
        "409":
          description: El código de tarjeta ya existe
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "422":
          description: Datos malformados o faltantes
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Crea un nuevo empleado
      tags:
      - Employee
  /employees/{id}:
    delete:
      description: Elimina un employee por su ID de la base de datos
      parameters:
      - description: ID del employee
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: employee eliminado exitosamente
        "400":
          description: ID no enviado o malformado
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: El employee no existe
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Elimina un employee por su ID
      tags:
      - Employee
    get:
      description: Retorna la información de un Employee por su ID
      parameters:
      - description: ID del Employee
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Listado de Employees
          schema:
            $ref: '#/definitions/domain.EmployeesResponse'
        "400":
          description: ID no enviado o malformado
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: El employee no existe
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Retorna un Employee por su ID
      tags:
      - Employee
    patch:
      consumes:
      - application/json
      description: Actualiza los datos de un empleado existente en el sistema
      parameters:
      - description: ID del empleado
        in: path
        name: id
        required: true
        type: integer
      - description: Datos del empleado a actualizar
        in: body
        name: employee
        required: true
        schema:
          $ref: '#/definitions/domain.EmployeeAttributes'
      produces:
      - application/json
      responses:
        "200":
          description: Empleado actualizado exitosamente
          schema:
            $ref: '#/definitions/domain.EmployeeResponse'
        "400":
          description: ID no enviado o malformado
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: El empleado no existe
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "409":
          description: El código de tarjeta ya existe
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "422":
          description: Datos malformados o faltantes
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Actualiza un empleado por su ID
      tags:
      - Employee
  /inboundOrders:
    post:
      description: Crea un nuevo inbound en el sistema
      parameters:
      - description: inbound order a crear
        in: body
        name: InboundOrder
        required: true
        schema:
          $ref: '#/definitions/domain.InboundOrderAttributes'
      produces:
      - application/json
      responses:
        "201":
          description: Inbound Order creado exitosamente
          schema:
            $ref: '#/definitions/domain.InboundOrderResponse'
        "409":
          description: Conflicto de clave foránea o unica
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "422":
          description: Datos malformados o faltantes
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Crea un nuevo inbound order
      tags:
      - InboundOrder
  /productBatches:
    post:
      description: Crea un nuevo product batch en el sistema
      parameters:
      - description: product batch a crear
        in: body
        name: productBatch
        required: true
        schema:
          $ref: '#/definitions/domain.ProductBatchAttributes'
      produces:
      - application/json
      responses:
        "201":
          description: Product Batch creado exitosamente
          schema:
            $ref: '#/definitions/domain.ProductBatchResponse'
        "409":
