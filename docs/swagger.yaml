          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "422":
          description: Datos malformados o faltantes
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Crea un nuevo product batch
      tags:
      - ProductBatch
  /productRecords:
    get:
      description: Devuelve todos los reportes de productos y filtra por id de producto
      parameters:
      - description: ID del producto
        in: query
        name: id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Lista de reportes obtenida exitosamente
          schema:
            $ref: '#/definitions/domain.ReportResponse'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Devuelve todos los reportes de productos y filtra por id de producto
      tags:
      - ProductRecord
  /products:
